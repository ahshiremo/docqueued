name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Detect Go packages
        id: packages
        run: |
          packages=$(go list ./...)
          if [[ -z "$packages" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No Go packages yet; lint, tests, and race detection skipped (bootstrap only)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.packages.outputs.available == 'true'
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2

      - name: Test
        if: steps.packages.outputs.available == 'true'
        run: go test -timeout=5m ./...

      - name: Race detection
        if: steps.packages.outputs.available == 'true'
        run: go test -race -timeout=5m ./...
